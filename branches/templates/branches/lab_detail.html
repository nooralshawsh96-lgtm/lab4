<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تفاصيل {{ lab.branch_name }}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 50px; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; max-width: 600px; margin: auto; border: 1px solid #6366f1; }
        img { width: 100%; height: 300px; object-fit: cover; border-radius: 15px; margin-bottom: 20px; }
        h1 { margin-bottom: 10px; color: #818cf8; }
        p { color: #94a3b8; line-height: 1.6; margin-bottom: 20px; }
        a { background: #6366f1; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 10px; display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        {% if lab.image %}
            <img src="{{ lab.image.url }}" alt="{{ lab.branch_name }}">
        {% endif %}
        <h1>{{ lab.branch_name }}</h1>
        <p><strong>كود المعمل:</strong> {{ lab.branch_code }}</p>
        <p><strong>الوصف:</strong> {{ lab.description }}</p>
        <p><strong>الحالة:</strong> {% if lab.is_active %}متاح للحجز{% else %}صيانة{% endif %}</p>
        <a href="{% url 'dashboard' %}">العودة إلى لوحة التحكم</a>
    </div>
</body>
</html>
