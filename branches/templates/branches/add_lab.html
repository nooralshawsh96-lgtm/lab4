<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة معمل جديد</title>
</head>
<body style="font-family: Tahoma; padding: 20px; background-color: #f4f6f9;">
    <h2>إضافة معمل جديد</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="padding: 10px 20px; background-color: #4f46e5; color: white; border: none; border-radius: 5px; cursor: pointer;">حفظ البيانات</button>
    </form>
    <br>
    <a href="{% url 'dashboard' %}">العودة إلى لوحة التحكم</a>
</body>
</html>
