{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - نظام إدارة المعامل</title>
    <style>
        * {
            box-sizing: border-box;
        }

        /* --- خلفية حقيقية لمعمل طلاب وأجهزة بلون أزرق غامق وتقني --- */
        body.auth-page {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://images.unsplash.com/photo-1531482615713-2afd69097998?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        /* طبقة عتمة زرقاء داكنة تدمج معمل الأجهزة مع الواجهة بشكل احترافي */
        body.auth-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.78);
            backdrop-filter: blur(2px);
            z-index: 1;
        }

        /* --- الصندوق الزجاجي الفاخر المتناسق --- */
        .auth-card {
            position: relative;
            z-index: 2;
            width: 480px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 28px;
            padding: 42px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 35px rgba(37, 99, 235, 0.2);
            text-align: center;
            direction: rtl;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        /* --- أيقونة اللوجو الأنيقة --- */
        .auth-logo-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px auto;
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.3);
            font-size: 32px;
        }

        /* --- عناوين النصوص --- */
        .auth-card h2 {
            margin: 0 0 6px 0;
            color: #ffffff;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .auth-subtitle {
            color: #cbd5e1;
            font-size: 13.5px;
            margin-bottom: 28px;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 7px;
        }

        /* --- حقول الإدخال الاحترافية --- */
        .input-group input {
            width: 100%;
            padding: 14px 20px;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 35px;
            background-color: rgba(30, 41, 59, 0.7);
            color: #ffffff;
            font-size: 13.5px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: #94a3b8;
        }

        .input-group input:focus {
            border-color: #60a5fa;
            background-color: rgba(30, 41, 59, 0.95);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        /* --- زر تسجيل الدخول المضيء --- */
        .btn-auth {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 35px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            font-size: 15.5px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.45);
            margin-top: 8px;
            transition: all 0.25s ease;
        }

        .btn-auth:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.6);
            transform: translateY(-1px);
        }

        /* --- روابط التذييل المتناسقة --- */
        .auth-footer-links {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-top: 24px;
        }

        .auth-footer-links a {
            color: #93c5fd;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .auth-footer-links a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>
<body class="auth-page">
    
    <div class="auth-card">
        <div class="auth-logo-icon">💻</div>
        
        <h2>مرحباً بعودتك</h2>
        <p class="auth-subtitle">سجل الدخول إلى نظام إدارة المعامل</p>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" name="email" placeholder="البريد الإلكتروني" required>
            </div>
            
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" name="password" placeholder="كلمة المرور" required>
            </div>
            
            <button type="submit" class="btn-auth">تسجيل الدخول</button>
        </form>
        
        <div class="auth-footer-links">
            <a href="#">هل نسيت كلمة المرور</a>
            <a href="{% url 'register' %}">إنشاء حساب جديد</a>
        </div>
    </div>
    
</body>
</html>
